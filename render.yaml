# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" and pick the repository. Render reads this file and
# asks for the three secrets below.
#
# Keep workers at 1: the app keeps the selected field, the environment cache
# and the AppEEARS task in module-level memory, so a second worker would show
# a different field than the one the browser picked. Threads give concurrency.
services:
  - type: web
    name: harvest-atlas
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 180 --access-logfile -
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Set these in the Render dashboard, never in git.
      - key: GROQ_API_KEY
        sync: false
      - key: EARTHDATA_USERNAME
        sync: false
      - key: EARTHDATA_PASSWORD
        sync: false
